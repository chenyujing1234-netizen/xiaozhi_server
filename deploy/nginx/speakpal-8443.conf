# SpeakPal IP HTTPS 备用入口（自签证书）
# https://124.221.115.174:8443/
# https://124.221.115.174:8443/english/

upstream xiaozhi_ota_8443 {
    server 127.0.0.1:8002;
    keepalive 4;
}

upstream xiaozhi_ws_8443 {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 124.221.115.174 _;

    ssl_certificate /home/chenyj/xiaozhi_server/certs/server.crt;
    ssl_certificate_key /home/chenyj/xiaozhi_server/certs/server.key;

    root /home/chenyj/xiaozhi_server/web;
    index index.html;
    client_max_body_size 10M;

    location /static/ {
        alias /home/chenyj/xiaozhi_server/web/static/;
        expires 1h;
        access_log off;
    }

    location = /english {
        return 301 /english/;
    }
    location = /english/ {
        try_files /english.html =404;
    }
    location = /admin {
        return 301 /admin/;
    }
    location = /admin/ {
        try_files /admin.html =404;
    }
    location = /speak {
        return 302 /english/;
    }
    location = /speak/ {
        return 302 /english/;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://xiaozhi_ota_8443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /xiaozhi/ {
        proxy_pass http://xiaozhi_ota_8443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /xiaozhi/english/v1/ {
        # 非 WebSocket 请求（浏览器地址栏、爬虫）不要转给后端，避免 InvalidUpgrade 刷屏
        if ($http_upgrade != "websocket") {
            return 426;
        }
        proxy_pass http://xiaozhi_ws_8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
