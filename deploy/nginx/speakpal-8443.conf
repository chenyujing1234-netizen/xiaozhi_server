# SpeakPal IP 直连：8443 同时提供 HTTPS 页面 + WSS（共用一个端口/证书）
# 解决：页面 :8443 可访问但 :8444 WebSocket 被防火墙拦截的问题
#
# 部署: sudo tools/setup_speakpal_8443.sh

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 124.221.115.174 _;

    ssl_certificate /home/chenyj/xiaozhi_server/certs/server.crt;
    ssl_certificate_key /home/chenyj/xiaozhi_server/certs/server.key;

    client_max_body_size 10M;

    location /xiaozhi/english/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
