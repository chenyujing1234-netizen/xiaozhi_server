# SpeakPal / LinkPal — nginx（Let's Encrypt）
#
# 官网静态文件由 nginx 直接托管，不依赖 Python:8002，避免间歇 502。
# OTA / WebSocket 仍反代到后端。
#
# 官网: https://linkpal.cloud/
# 口语: https://linkpal.cloud/english/
# WSS:  wss://linkpal.cloud/xiaozhi/english/v1/

upstream xiaozhi_ota {
    server 127.0.0.1:8002;
    keepalive 8;
}

upstream xiaozhi_ws {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name linkpal.cloud www.linkpal.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 关闭 http2：部分微信/手机浏览器对 HTTP/2 连接复用不稳定
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name linkpal.cloud www.linkpal.cloud;

    ssl_certificate /etc/letsencrypt/live/linkpal.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkpal.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/chenyj/xiaozhi_server/web;
    index index.html;

    # 静态资源
    location /static/ {
        alias /home/chenyj/xiaozhi_server/web/static/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    # SpeakPal 用户页（用 root + try_files，避免 alias 拼接错误）
    location = /english {
        return 301 /english/;
    }
    location = /english/ {
        try_files /english.html =404;
    }
    location = /admin {
        return 301 /admin/;
    }
    location = /admin/ {
        try_files /admin.html =404;
    }
    location = /speak {
        return 302 /english/;
    }
    location = /speak/ {
        return 302 /english/;
    }

    # 测试页（保留，不对外宣传）
    location = /english-test {
        return 301 /english-test/;
    }
    location = /english-test/ {
        try_files /english-test.html =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # 官网首页与其它静态页
    location / {
        try_files $uri $uri/ =404;
    }

    # SpeakPal 登录 API（手机号 / 微信）
    location /api/ {
        proxy_pass http://xiaozhi_ota;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # OTA / 激活仍走 Python
    location /xiaozhi/ {
        proxy_pass http://xiaozhi_ota;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 英语 WebSocket
    location /xiaozhi/english/v1/ {
        if ($http_upgrade != "websocket") {
            return 426;
        }
        proxy_pass http://xiaozhi_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
