# SpeakPal / LinkPal — nginx 反向代理（Let's Encrypt 终止 TLS）
# 部署: sudo tools/setup_linkpal_ssl.sh
#
# 用户入口: https://linkpal.cloud/english/
# WebSocket: wss://linkpal.cloud/xiaozhi/english/v1/

server {
    listen 80;
    listen [::]:80;
    server_name linkpal.cloud www.linkpal.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name linkpal.cloud www.linkpal.cloud;

    ssl_certificate /etc/letsencrypt/live/www.linkpal.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.linkpal.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Web 口语页 + 宣传站静态资源（xiaozhi_server :8002）
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 英语 WebSocket（xiaozhi_server :8000，nginx 终止 TLS）
    location /xiaozhi/english/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
